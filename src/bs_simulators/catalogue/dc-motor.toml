name = "dc-motor"
model = "dc_motor"
x0 = [0.0, 0.0, 0.0]
u0 = [1.0]
dt = 0.01
t0 = 0.0
active_controller = "python"
viewer = "dc-motor"

[parameters]
J = 0.02
b = 0.1
Ke = 0.01
Kt = 0.01
R = 1.0
L = 0.5

[stepper]
kind = "ode"
method = "RK45"
rtol = 1e-7
atol = 1e-9

[[state_signals]]
name = "theta"
unit = "rad"
dtype = "float64"
direction = "output"

[[state_signals]]
name = "omega"
unit = "rad/s"
dtype = "float64"
direction = "output"

[[state_signals]]
name = "current"
unit = "A"
dtype = "float64"
direction = "output"

[[input_signals]]
name = "voltage"
unit = "V"
dtype = "float64"
direction = "input"
