name = "pendulum"
model = "pendulum"
x0 = [3.041592653589793, 0.0] # pi - 0.1 rad
u0 = [0.0]
dt = 0.01
t0 = 0.0
active_controller = "python"
viewer = "pendulum"

[parameters]
m = 1.0
L = 2.0
drag = 0.0

[stepper]
kind = "ode"
method = "RK45"
rtol = 1e-7
atol = 1e-9

[[state_signals]]
name = "theta"
unit = "rad"
dtype = "float64"
direction = "output"

[[state_signals]]
name = "omega"
unit = "rad/s"
dtype = "float64"
direction = "output"

[[input_signals]]
name = "torque"
unit = "N m"
dtype = "float64"
direction = "input"
