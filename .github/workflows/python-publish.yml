name: Publish bs-simulators to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    if: github.repository == 'ggonzm/bs-simulators'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release commit
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install release tools
        run: python -m pip install "pdm==2.29.7" twine

      - name: Install locked dependencies
        run: |
          pdm lock --check
          pdm sync -G dev -G replay

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pdm run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from bs_simulators import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == __version__, "Package versions do not match"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must be v<version>"
          PY

      - name: Build and verify distributions
        run: |
          pdm build
          python -m twine check --strict dist/*
          pdm run pytest

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/bs-simulators/

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
